# Вставить ЭТИ ДВА location внутрь server-блока сайта app.academyauto.ru
# (в файле вроде /etc/nginx/sites-available/app.academyauto.ru), рядом с
# существующим `location /`. После правки: nginx -t && systemctl reload nginx

# 1) Раздача загруженных фотографий (отдаёт nginx напрямую с диска — быстро).
location /uploads/ {
    alias /var/www/academyauto-uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
}

# 2) Приёмник загрузок — проксируем на программу-приёмник (Node, порт 4300).
location /api/photos/ {
    proxy_pass http://127.0.0.1:4300/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # ВАЖНО: по умолчанию nginx режет тело запроса на 1 МБ и загрузка фото падает
    # с ошибкой 413. Поднимаем лимит (фото после сжатия ~0.3 МБ, но снимок-оригинал
    # с современного телефона может быть и больше).
    client_max_body_size 20m;
}
